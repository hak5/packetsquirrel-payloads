<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Authentication Required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
  }
  .lock-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #616161;
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c4c4c4;
    border-radius: 4px;
    font-size: 15px;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  input:focus {
    outline: none;
    border-color: #0067b8;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #0067b8;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  button:hover { background: #005a9e; }
  .footer {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin-top: 24px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Lock icon as inline SVG -->
  <svg class="lock-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="20" width="32" height="24" rx="4" fill="#0067b8"/>
    <path d="M16 20V14a8 8 0 1 1 16 0v6" stroke="#0067b8" stroke-width="3" fill="none"/>
    <circle cx="24" cy="32" r="3" fill="white"/>
    <rect x="23" y="34" width="2" height="4" rx="1" fill="white"/>
  </svg>

  <h1>Network Authentication Required</h1>
  <p class="subtitle">Sign in with your organization credentials to connect to the network.</p>

  <form method="POST" action="/login">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="user@company.com" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required>

    <button type="submit">Connect</button>
  </form>

  <p class="footer">
    Secure network access provided by IT Services.<br>
    By signing in you agree to the acceptable use policy.
  </p>
</div>
</body>
</html>
